<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAELSTROM · PQC Migrator</title>
<style>
  :root{--bg:#0b0e14;--panel:#11161f;--panel2:#0d121a;--border:#222b3a;--txt:#c9d4e3;
    --muted:#7d8aa0;--accent:#58a6ff;--cyan:#39d4d4;--red:#ff5c5c;--green:#3fb950;--amber:#e3b341;--purple:#a988ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(63,185,80,.10),transparent 60%),
      radial-gradient(1000px 500px at -10% 110%,rgba(169,136,255,.10),transparent 55%),var(--bg)}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.6px}
  .logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 0deg,#39d4d4,#58a6ff,#a020f0,#39d4d4);
    display:grid;place-items:center;font-size:18px;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:.72rem}
  .steps{display:flex;gap:8px;flex-wrap:wrap}
  .steps a{color:var(--muted);text-decoration:none;font-size:.86rem;padding:8px 13px;border:1px solid var(--border);border-radius:9px;transition:.2s}
  .steps a:hover{color:var(--txt);border-color:var(--accent);background:rgba(88,166,255,.08)}
  .steps a.active{color:#fff;border-color:var(--cyan);background:rgba(57,212,212,.12)}
  .steps a.egg{border-style:dashed;border-color:#ffd84d55;color:#ffd84d}
  /* hero */
  .hero{max-width:980px;margin:0 auto;padding:46px 26px 8px;text-align:center}
  .wip{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:1px;
    color:#1b1300;background:repeating-linear-gradient(45deg,#ffd84d,#ffd84d 10px,#1b0033 10px,#1b0033 20px);
    padding:6px 14px;border-radius:999px;animation:wip 1.2s linear infinite;background-size:200% 100%}
  @keyframes wip{to{background-position:28px 0}}
  .wip b{background:#0b0e14;color:#ffd84d;padding:2px 8px;border-radius:999px}
  .hero h1{font-size:clamp(2.4rem,8vw,5rem);margin:14px 0 0;font-weight:900;letter-spacing:2px;
    background:linear-gradient(90deg,#39d4d4,#3fb950,#a988ff,#39d4d4);background-size:300%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
  @keyframes sh{to{background-position:300%}}
  .hero p{color:var(--muted);font-size:1.05rem;margin:12px auto 0;max-width:620px}
  .hero p b{color:var(--txt)}
  main{max-width:1100px;margin:0 auto;padding:24px 26px}
  .sec{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .cap{text-align:center;color:var(--muted);font-size:.82rem;margin:4px 0 0}
  .h{text-align:center;font-size:.74rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--purple);margin:0 0 16px}
  /* llaves forjándose */
  .forge-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .forge{width:128px;border:1px solid var(--border);border-radius:14px;padding:14px 12px;background:#0a0f17;text-align:center;
    animation:cardglow 3.2s ease-in-out infinite}
  .forge .ic{font-size:2.4rem;line-height:1;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}55%{transform:translateY(-6px) rotate(6deg)}}
  .forge .bar{height:7px;background:#11161f;border-radius:7px;overflow:hidden;margin:11px 0 8px;border:1px solid var(--border)}
  .forge .bar i{display:block;height:100%;width:0;border-radius:7px;
    background:linear-gradient(90deg,var(--amber),var(--green));animation:fill 3.2s ease-in-out infinite}
  @keyframes fill{0%{width:6%}55%{width:100%}100%{width:100%}}
  .forge .lab{position:relative;height:1.2em;font-size:.74rem;font-weight:700}
  .forge .lab span{position:absolute;left:0;right:0}
  .forge .t1{color:var(--amber);animation:f1 3.2s ease-in-out infinite}
  .forge .t2{color:var(--green);animation:f2 3.2s ease-in-out infinite;opacity:0}
  @keyframes f1{0%,50%{opacity:1}60%,100%{opacity:0}}
  @keyframes f2{0%,55%{opacity:0}65%,100%{opacity:1}}
  @keyframes cardglow{0%,55%{box-shadow:none;border-color:var(--border)}75%,100%{box-shadow:0 0 22px rgba(63,185,80,.45);border-color:var(--green)}}
  /* 2x2 mini */
  .mini2{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
  .mc{border:1.5px solid var(--border);border-radius:12px;padding:14px;background:#0a0f17;text-align:center;font-weight:700;font-size:.84rem}
  .mc .e{font-size:1.7rem;display:block;margin-bottom:6px}
  .mc.red{border-color:#ff5c5c55} .mc.amber{border-color:#e3b34155}
  .mc.green{border-color:var(--green);box-shadow:0 0 22px rgba(63,185,80,.35);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 34px rgba(63,185,80,.6)}}
  .mc small{display:block;color:var(--muted);font-weight:500;font-size:.72rem;margin-top:3px}
  /* roadmap */
  .road{display:flex;align-items:stretch;gap:6px;justify-content:center;flex-wrap:wrap}
  .rstep{flex:1;min-width:120px;border-radius:14px;padding:16px 10px;text-align:center;border:1px solid var(--border);background:#0a0f17}
  .rstep .ric{font-size:2rem}
  .rstep .rl{font-weight:700;font-size:.82rem;margin-top:6px}
  .rstep .rb{display:inline-block;margin-top:7px;font-size:.66rem;font-weight:800;letter-spacing:.5px;padding:3px 9px;border-radius:999px}
  .rstep.done{border-color:var(--green);box-shadow:0 0 18px rgba(63,185,80,.25)}
  .rstep.done .rb{background:rgba(63,185,80,.18);color:var(--green)}
  .rstep.soon{border-style:dashed;opacity:.7}
  .rstep.soon .rb{background:rgba(227,179,65,.15);color:var(--amber)}
  .rstep.soon::after{content:"🚧";display:block;margin-top:4px;font-size:.8rem;animation:bob 2.6s infinite}
  .arr{display:flex;align-items:center;color:var(--muted);font-size:1.3rem}
  @media (max-width:720px){.arr{display:none}}
  /* keygen */
  .kbtn{display:block;margin:0 auto;border:none;border-radius:14px;padding:16px 28px;cursor:pointer;color:#06121a;font-weight:800;font-size:1.02rem;
    background:linear-gradient(135deg,#39d4d4,#3fb950);box-shadow:0 8px 24px rgba(63,185,80,.35);transition:.18s}
  .kbtn:hover{transform:translateY(-2px)} .kbtn:disabled{opacity:.6;cursor:wait;transform:none}
  .pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px}
  .node{border:1px solid var(--border);border-radius:12px;padding:13px;background:#0a0f17}
  .node .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);font-weight:800}
  .node .big{font-size:1.2rem;margin:6px 0 2px}
  .node .hex{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:var(--cyan);word-break:break-all;margin-top:6px}
  .node .sz{color:var(--muted);font-size:.72rem;margin-top:4px}
  .ss{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media (max-width:560px){.ss{grid-template-columns:1fr}}
  .ssbox{border:1px solid var(--border);border-radius:10px;padding:11px;background:#0a0f17}
  .ssbox .lbl{font-size:.72rem;color:var(--muted);font-weight:700}
  .ssbox .hex{font-family:ui-monospace,Menlo,monospace;font-size:.74rem;color:var(--green);word-break:break-all;margin-top:5px}
  .kbanner{margin-top:16px;border-radius:12px;padding:14px 16px;font-weight:700;display:none;align-items:center;gap:12px;font-size:1rem}
  .kbanner.ok{display:flex;background:rgba(63,185,80,.12);border:1px solid var(--green);color:#a7e9b1}
  .kbanner.bad{display:flex;background:rgba(255,92,92,.12);border:1px solid var(--red);color:#ffb3b3}
  .kbanner .big{font-size:1.5rem}
  .kstatus{text-align:center;color:var(--muted);font-size:.82rem;margin-top:10px;min-height:1.2em}
  .footnav{max-width:1100px;margin:0 auto;padding:6px 26px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .footnav a{color:var(--txt);text-decoration:none;padding:12px 22px;border:1px solid var(--border);border-radius:12px;font-weight:700;transition:.18s}
  .footnav a:hover{border-color:var(--cyan);background:rgba(57,212,212,.1)}
  .footnav a.next{background:linear-gradient(135deg,#ffd84d,#ff9d00);color:#1b0033;border:none}
</style>
</head>

<header>
  <div class="brand"><div class="logo">🌀</div><div>MAELSTROM <small>PQC Accelerator · the migrator</small></div></div>
  <nav class="steps">

    <a href="backstage.html">① How it works</a>

  <!DOCTYPE html>
<html lang="en">


<section class="hero">
<h1>PQC&nbsp;MIGRATOR</h1>
  <p><b>Today</b> we forge the keys. <b>Tomorrow</b> we automate your whole post-quantum migration.</p>
</section>

<main>
  <!-- llaves forjándose -->
<section class="sec">
  <p class="h">🔑 forging quantum-safe keys</p>

  <div class="forge-row" style="display:flex;align-items:center;justify-content:center;gap:36px;margin:10px 0 24px">
    <div style="text-align:center"><div style="font-size:4.5rem">🔑</div></div>

    <svg width="260" height="80" viewBox="0 0 260 80" style="overflow:visible">
      <path id="curve" d="M 10 60 Q 130 -40 250 60" fill="none" stroke="#222b3a" stroke-width="2" stroke-dasharray="6 6"/>
      <circle r="5" fill="#58a6ff">
        <animateMotion dur="2s" repeatCount="indefinite" path="M 10 60 Q 130 -40 250 60" />
      </circle>
    </svg>

    <div style="text-align:center"><div style="font-size:4.5rem">🔒</div></div>
  </div>

<div style="max-width:520px;margin:10px auto">
  <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-bottom:8px">
    <span>Building quantum-safe protection</span>
    <span id="pct">0%</span>
  </div>
  <div style="height:12px;background:#1a1f28;border-radius:999px;overflow:hidden;border:1px solid var(--border)">
    <div id="progressFill" style="height:100%;width:0%;background:repeating-linear-gradient(90deg,#e3b341,#e3b341 8px,#b58f33 8px,#b58f33 16px);transition:width 0.5s ease-out"></div>
  </div>
</div>

<script>
(function(){
  const fill = document.getElementById('progressFill');
  const pct = document.getElementById('pct');
  let p = 0;
  
  const timer = setInterval(()=>{
    if(p < 45) {
      p++;
      fill.style.width = p + '%';
      pct.textContent = p + '%';
    } else {
      clearInterval(timer);
    }
  }, 50);
})();
</script>

  <script>
    (function(){
      let p = 0;
      const segs = document.querySelectorAll('.seg');
      const pct = document.getElementById('pct');
      
      const interval = setInterval(()=>{
        if(p < 45) {
          p++;
          const activeIdx = Math.floor((p / 45) * 8);
          if(activeIdx < 8) {
            segs[activeIdx].style.background = '#e3b341'; // Amber/Yellow
          }
          pct.textContent = p + '%';
        } else {
          clearInterval(interval);
        }
      }, 50);
    })();
  </script>
</section>

  </main></body></html>
